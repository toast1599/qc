[package]
name = "qc-cli"
version = "0.5.8"
edition = "2024"
description = "qc is designed to give you an instant breakdown of your codebase composition using Mmap and Parallel Directory Walking."
repository = "https://github.com/toast1599/qc"
readme = "README.md"
license = "GPL-3.0-or-later"
keywords = ["cli", "metrics", "code-analysis"]
categories = ["command-line-utilities"]

[[bin]]
name = "qc"           
path = "src/main.rs"

[dependencies]
bytecount = "0.6.9"
crossbeam-channel = "0.5.15"
ignore = "0.4.25"
indicatif = "0.18.3"
memmap2 = "0.9.9"
serde = { version = "1.0", features = ["derive"] }
serde_yml = "0.0.12"
serde_json = "1"
# Removed once_cell and num_cpus in favor of std library (Rust 1.85+)

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dist]
inherits = "release"
lto = "thin"
